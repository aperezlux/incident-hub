# Pipeline de CI de IT Incident Hub
trigger:
  branches:
    include: [main]
pr:
  branches:
    include: [main]

parameters:
  - name: agentPool
    displayName: Pool de agentes (autohospedado)
    type: string
    default: Default

variables:
  - group: incident-hub-secrets   # variable group con DB_PASSWORD secreta (Pipelines > Library)
  - name: NODE_VERSION
    value: '20.x'

stages:
  - stage: CI
    displayName: Integración continua
    pool:
      name: ${{ parameters.agentPool }}
    jobs:
      - job: build_test
        displayName: Build, pruebas y seguridad
        steps:
          - checkout: self
            displayName: Checkout del repositorio

          - task: NodeTool@0
            displayName: Instalar Node.js
            inputs:
              versionSpec: $(NODE_VERSION)

          - script: node devops/scripts/buscar-secretos.js
            displayName: Escaneo de secretos en el repositorio

          - script: node -e "if(!process.env.DB_PASSWORD){console.error('DB_PASSWORD no configurada');process.exit(1)}console.log('DB_PASSWORD presente (valor oculto)')"
            displayName: Verificar secretos protegidos
            env:
              DB_PASSWORD: $(DB_PASSWORD)

          - script: node devops/scripts/verificar-version.js
            displayName: Verificar versionado SemVer y CHANGELOG

          - script: npm install --no-audit --no-fund
            workingDirectory: backend
            displayName: Instalar dependencias (backend)

          - script: npm install --no-audit --no-fund
            workingDirectory: frontend
            displayName: Instalar dependencias (frontend)

          - script: npm run lint
            workingDirectory: backend
            displayName: Lint backend

          - script: npm run lint
            workingDirectory: frontend
            displayName: Lint frontend

          - script: npm test
            workingDirectory: backend
            displayName: Pruebas backend (con cobertura)

          - script: npm test
            workingDirectory: frontend
            displayName: Pruebas frontend

          - task: PublishTestResults@2
            displayName: Publicar resultados de pruebas
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '**/junit.xml'
              searchFolder: $(System.DefaultWorkingDirectory)/backend
              testRunTitle: Backend

          - task: PublishCodeCoverageResults@2
            displayName: Publicar cobertura
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: $(System.DefaultWorkingDirectory)/backend/coverage/cobertura-coverage.xml

          - script: npm run build
            workingDirectory: frontend
            displayName: Build frontend

          - script: npm audit --omit=dev --audit-level=critical
            workingDirectory: backend
            displayName: Revisión de dependencias (backend, falla en críticas)

          - script: npm audit --omit=dev --audit-level=critical
            workingDirectory: frontend
            displayName: Revisión de dependencias (frontend, falla en críticas)

          - script: node devops/scripts/empaquetar.js $(Build.ArtifactStagingDirectory)/incident-hub
            displayName: Empaquetar artefacto

          - task: PublishBuildArtifacts@1
            displayName: Publicar artefacto
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)/incident-hub
              ArtifactName: incident-hub

  # ---------- RELEASE: Dev -> QA -> Producción (solo desde main) ----------
  - stage: Dev
    displayName: Despliegue a Dev
    dependsOn: CI
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    pool:
      name: ${{ parameters.agentPool }}
    jobs:
      - deployment: desplegar_dev
        displayName: Desplegar y validar en Dev
        environment: Dev
        strategy:
          runOnce:
            deploy:
              steps:
                - script: node $(Pipeline.Workspace)/incident-hub/devops/desplegar.js $(Pipeline.Workspace)/incident-hub dev
                  displayName: Desplegar en Dev (con validación y rollback automático)

  - stage: QA
    displayName: Despliegue a QA (requiere aprobación)
    dependsOn: Dev
    condition: succeeded()
    pool:
      name: ${{ parameters.agentPool }}
    jobs:
      - deployment: desplegar_qa
        displayName: Desplegar y validar en QA
        environment: QA          # configurar Approvals and checks en este ambiente
        strategy:
          runOnce:
            deploy:
              steps:
                - script: node $(Pipeline.Workspace)/incident-hub/devops/desplegar.js $(Pipeline.Workspace)/incident-hub qa
                  displayName: Desplegar en QA

  - stage: Produccion
    displayName: Despliegue a Producción (requiere aprobación)
    dependsOn: QA
    condition: succeeded()
    pool:
      name: ${{ parameters.agentPool }}
    jobs:
      - deployment: desplegar_prod
        displayName: Desplegar y validar en Producción
        environment: Produccion  # configurar Approvals and checks en este ambiente
        strategy:
          runOnce:
            deploy:
              steps:
                - script: node $(Pipeline.Workspace)/incident-hub/devops/desplegar.js $(Pipeline.Workspace)/incident-hub produccion
                  displayName: Desplegar en Producción
